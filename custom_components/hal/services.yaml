turn_off:
  description: Turn off all HAL zones.
  fields:
    hal_name:
      description: Name of the HAL unit.
      example: "HAL"
set_select_interval:
  description: Set the select interval used for serial comms to the HAL unit.
  fields:
    hal_name:
      description: Name of the HAL unit.
      example: "HAL"
    hal_select_interval:
      description: Time in seconds to wait to data from the HAL unit.
      example: 0.6
intercom_enable:
  description: Enable Intercom Interupt mode.
  fields:
    hal_name:
      description: Name of the HAL unit.
      example: "HAL"
intercom_disable:
  description: Disable Intercom Interupt mode.
  fields:
    hal_name:
      description: Name of the HAL unit.
      example: "HAL"
